<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZERO AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050507;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 22px;
      border-bottom: 1px solid #1b1b22;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .online {
      color: #43ff9a;
      font-size: 11px;
    }

    .hero {
      text-align: center;
      padding: 30px 20px 20px;
    }

    .orb {
      width: 125px;
      height: 125px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #08080d;
      border: 2px solid #9185ff;
      box-shadow: 0 0 45px #5d51ff;
      font-size: 58px;
      font-weight: bold;
    }

    .hero h1 {
      margin: 15px 0 5px;
    }

    .hero p {
      color: #777;
      margin: 0;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 82%;
      padding: 13px 15px;
      margin: 8px 0;
      border-radius: 18px;
      line-height: 1.5;
    }

    .ai {
      background: #15151b;
    }

    .user {
      background: #373342;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #1b1b22;
    }

    input {
      flex: 1;
      border: 0;
      outline: none;
      border-radius: 25px;
      padding: 14px 18px;
      background: #111116;
      color: white;
      font-size: 15px;
    }

    button {
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .send {
      background: white;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">ZERO</div>
    <div class="online"> ONLINE</div>
  </div>

  <div class="hero">
    <div class="orb">0</div>
    <h1>ZERO AI</h1>
    <p>Your intelligent assistant</p>
  </div>

  <div class="chat" id="chat">
    <div class="message ai">
      Hello! I'm ZERO AI. How can I help you?
    </div>
  </div>

  <div class="input-area">
    <input
      id="input"
      placeholder="Ask ZERO anything..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    />

    <button class="send" onclick="sendMessage()"></button>
  </div>

</div>

<script>
function sendMessage() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.innerText = text;

  chat.appendChild(user);

  input.value = "";

  setTimeout(() => {

    const ai = document.createElement("div");
    ai.className = "message ai";

    ai.innerText =
      "ZERO AI is ready. Real AI connection will be added next.";

    chat.appendChild(ai);

    chat.scrollTop = chat.scrollHeight;

  }, 500);
}
</script>

</body>
</html><script>
async function sendMessage() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value.trim();

  if (!text) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.innerText = text;

  chat.appendChild(user);

  input.value = "";

  const loading = document.createElement("div");
  loading.className = "message ai";
  loading.innerText = "ZERO AI is thinking...";
  loading.id = "loading";

  chat.appendChild(loading);

  chat.scrollTop = chat.scrollHeight;

  try {

    const response = await fetch(
      "http://localhost:3000/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: text
        })
      }
    );

    const data = await response.json();

    document.getElementById("loading").remove();

    const ai = document.createElement("div");
    ai.className = "message ai";

    ai.innerText =
      data.reply || "ZERO AI couldn't answer.";

    chat.appendChild(ai);

  } catch (error) {

    document.getElementById("loading").remove();

    const ai = document.createElement("div");
    ai.className = "message ai";

    ai.innerText =
      "ZERO AI server  connect   ";

    chat.appendChild(ai);
  }

  chat.scrollTop = chat.scrollHeight;
}
</script>
